<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Diary ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,#123b64,transparent 35%),
    radial-gradient(circle at 80% 80%,#5b176c,transparent 35%),
    #050713;
  color:white;
}

/* Background animation */
.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}

.orb{
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:#00c8ff35;
  filter:blur(40px);
  animation:move 8s infinite alternate ease-in-out;
}

.orb:nth-child(1){
  top:5%;
  left:5%;
}

.orb:nth-child(2){
  right:5%;
  bottom:5%;
  background:#b000ff35;
}

@keyframes move{
  to{
    transform:translate(100px,-60px) scale(1.4);
  }
}

/* Login */
#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:390px;
  padding:35px 25px;
  text-align:center;
  border-radius:28px;
  background:#ffffff12;
  border:1px solid #ffffff25;
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px #0008;
}

.lock{
  font-size:60px;
  margin-bottom:15px;
}

.login-box h1{
  margin-bottom:10px;
}

.login-box p{
  color:#b8bfd0;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #ffffff25;
  background:#0006;
  color:white;
  outline:none;
  font-size:16px;
  margin-bottom:14px;
}

button{
  cursor:pointer;
}

.unlock{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  color:white;
  font-size:17px;
  font-weight:bold;
  background:linear-gradient(135deg,#00bfff,#762cff);
}

#error{
  display:none;
  color:#ff6680;
  margin-top:15px;
}

/* Diary */
#diary{
  display:none;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
}

.title{
  margin-bottom:18px;
  font-size:27px;
}

/* Book */
.book{
  width:350px;
  max-width:90vw;
  height:500px;
  perspective:1800px;
  position:relative;
}

.book-cover{
  position:absolute;
  inset:0;
  border-radius:12px;
  background:linear-gradient(135deg,#704020,#261308);
  box-shadow:0 30px 70px #000b;
}

.page{
  position:absolute;
  inset:14px;
  padding:16px;
  border-radius:6px;
  background:linear-gradient(135deg,#fffdf5,#eadfc5);
  color:#35271d;
  transform-origin:left center;
  transition:transform .8s cubic-bezier(.65,.05,.36,1);
  z-index:2;
}

.page.flip{
  transform:rotateY(-180deg);
}

.page img{
  width:100%;
  height:330px;
  object-fit:cover;
  border-radius:6px;
  box-shadow:0 10px 25px #0005;
}

.info{
  text-align:center;
  margin-top:13px;
}

.info h2{
  font-family:Georgia,serif;
  font-size:21px;
}

.date{
  margin-top:5px;
  font-size:13px;
  color:#806d5d;
}

.caption{
  margin-top:8px;
  font-family:Georgia,serif;
}

/* Love button */
.controls{
  margin-top:22px;
  display:flex;
  align-items:center;
  gap:15px;
}

.love{
  padding:14px 32px;
  border:0;
  border-radius:50px;
  color:white;
  background:linear-gradient(135deg,#ff416c,#ff1744);
  font-size:17px;
  font-weight:bold;
  box-shadow:0 10px 30px #ff174450;
}

.love:active{
  transform:scale(.9);
}

.counter{
  color:#c7cada;
}

.lock-btn{
  position:fixed;
  top:18px;
  right:18px;
  padding:9px 15px;
  border:1px solid #ffffff25;
  border-radius:12px;
  color:white;
  background:#ffffff12;
}

/* Mobile */
@media(max-width:500px){

  .book{
    height:450px;
  }

  .page img{
    height:280px;
  }

  .title{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="orb"></div>
  <div class="orb"></div>
</div>


<!-- PASSWORD -->

<section id="login">

  <div class="login-box">

    <div class="lock">🔐</div>

    <h1>Private Diary</h1>

    <p>Enter your password</p>

    <input
      id="password"
      type="password"
      placeholder="Password">

    <button
      class="unlock"
      onclick="unlockDiary()">
      🔓 Open Diary
    </button>

    <div id="error">
      ❌ Wrong password
    </div>

  </div>

</section>


<!-- DIARY -->

<section id="diary">

  <button
    class="lock-btn"
    onclick="lockDiary()">
    🔒 Lock
  </button>

  <h1 class="title">
    📖 My Private Diary
  </h1>

  <div class="book">

    <div class="book-cover"></div>

    <div class="page" id="page">

      <img id="photo" src="memory-1.jpg">

      <div class="info">

        <h2 id="photoTitle">
          Signal Hackers ❤️
        </h2>

        <div class="date" id="photoDate">
          Memory 1
        </div>

        <div class="caption" id="photoCaption">
          A page from my private diary.
        </div>

      </div>

    </div>

  </div>

  <div class="controls">

    <button
      class="love"
      onclick="nextPage()">
      ❤️ Love
    </button>

    <div class="counter">
      <span id="number">1</span> / 3
    </div>

  </div>

</section>


<script>

const PASSWORD = "signal hackers";

const memories = [

  {
    image:"memory-1.jpg",
    title:"Signal Hackers ❤️",
    date:"Memory 1",
    caption:"A page from my private diary."
  },

  {
    image:"memory-2.jpg",
    title:"Cyber Sentinel 💙",
    date:"Memory 2",
    caption:"Another special memory."
  },

  {
    image:"memory-3.jpg",
    title:"CSB Cyber Security ✨",
    date:"Memory 3",
    caption:"One more page of the diary."
  }

];

let current = 0;
let busy = false;


/* Open diary */

function unlockDiary(){

  const password =
    document.getElementById("password").value;

  if(password === PASSWORD){

    document.getElementById("login")
      .style.display = "none";

    document.getElementById("diary")
      .style.display = "flex";

  }else{

    document.getElementById("error")
      .style.display = "block";

  }
}


/* Lock diary */

function lockDiary(){

  document.getElementById("diary")
    .style.display = "none";

  document.getElementById("login")
    .style.display = "flex";

  document.getElementById("password")
    .value = "";

  document.getElementById("error")
    .style.display = "none";
}


/* Change photo */

function nextPage(){

  if(busy) return;

  busy = true;

  const page =
    document.getElementById("page");

  page.classList.add("flip");

  setTimeout(function(){

    current++;

    if(current >= memories.length){
      current = 0;
    }

    const memory = memories[current];

    document.getElementById("photo")
      .src = memory.image;

    document.getElementById("photoTitle")
      .textContent = memory.title;

    document.getElementById("photoDate")
      .textContent = memory.date;

    document.getElementById("photoCaption")
      .textContent = memory.caption;

    document.getElementById("number")
      .textContent = current + 1;

    page.classList.remove("flip");

    busy = false;

  },450);
}


/* Enter key */

document
  .getElementById("password")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      unlockDiary();
    }

  });

</script>

</body>
</html>
